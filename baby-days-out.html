<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find nearby parent facilities and baby events">
    <title>Baby Days Out - Find Parent Facilities and Baby Events</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js" type="module"></script>
    <script src="baby-days-out.js" defer></script>
</head>
<body class="map-page">
    <main>
        <div id="map"></div>
        
        <div class="sidebar">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>
            
            <div class="sidebar-header">
                <a href="index.html" class="back-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                </a>
                <div>
                    <h1>Baby Days Out</h1>
                    <p class="subtitle">Find parent facilities and baby events near you</p>
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="location-search">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="location-input" placeholder="Enter your location">
                    </div>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
                
                <div class="sidebar-tabs">
                    <div class="sidebar-tab active" data-tab="list">List</div>
                    <div class="sidebar-tab" data-tab="filter">Filter</div>
                </div>
                
                <div class="sidebar-tab-content" id="list-tab">
                    <div id="directory" class="directory">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
                
                <div class="sidebar-tab-content" id="filter-tab" style="display: none;">
                    <div class="filter-checkboxes">
                        <div class="reset-filters">
                            <a href="#" id="reset-filters">Reset to Default</a>
                        </div>
                        
                        <div class="toggle-group">
                            <div class="toggle-item">
                                <label class="toggle-label">
                                    <span class="toggle-text">
                                        <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                            <path d="M7 7h10"></path>
                                            <path d="M7 12h10"></path>
                                            <path d="M7 17h10"></path>
                                        </svg>
                                        Facilities
                                    </span>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="filter-facilities" checked>
                                        <span class="toggle-slider"></span>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="toggle-item">
                                <label class="toggle-label">
                                    <span class="toggle-text">
                                        <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                                        </svg>
                                        Baby Events
                                    </span>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="filter-events" checked>
                                        <span class="toggle-slider"></span>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="date-filters">
                                <div class="filter-buttons" id="date-filters">
                                    <button class="filter-button" data-filter="today">Today</button>
                                    <button class="filter-button" data-filter="tomorrow">Tomorrow</button>
                                    <button class="filter-button" data-filter="weekend">This Weekend</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
