<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of soothing sounds for your baby">
    <meta name="theme-color" content="#FFF1E6">
    <title>Sleep Sounds - Baby Sleep & Rhyme Time</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon.svg">
    <link rel="icon" href="assets/images/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="app-container">
        <header>
            <a href="index.html" class="back-button">
                <img src="assets/images/chevron-left.svg" alt="Back" class="back-icon">
            </a>
            <h1>Select your sleep sound</h1>
            <p class="subtitle">Choose a sound below to help your baby sleep</p>
        </header>
        
        <main>
            <div class="volume-control">
                <button id="volumeToggle" class="volume-toggle" aria-label="Toggle volume">
                    <svg viewBox="0 0 24 24" class="volume-icon">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
            </div>
            
            <div class="carousel-container">
                <div class="carousel-nav prev">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                
                <div id="soundGrid" class="sound-grid">
                    <!-- Sound cards will be added here by JavaScript -->
                </div>
                
                <div class="carousel-nav next">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
