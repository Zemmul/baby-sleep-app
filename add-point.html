<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new point to the Baby Days Out map">
    <title>Add a Point - Baby Days Out</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js" type="module"></script>
</head>
<body>
    <header>
        <a href="index.html" class="back-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </a>
        <h1>Add a New Point</h1>
        <p class="subtitle">Help other parents by adding a new location to our map</p>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <form id="add-point-form" class="form">
                    <div class="form-group">
                        <label for="type">Type of Location</label>
                        <select id="type" name="type">
                            <option value="">Select a type</option>
                            <option value="toilet">Toilet</option>
                            <option value="parent_facility">Parent Facility</option>
                            <option value="event">Event</option>
                            <option value="park">Park</option>
                            <option value="playground">Playground</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter the name of the location">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Describe the location and its features"></textarea>
                    </div>
                    
                    <hr class="form-divider">
                    
                    <div class="form-group">
                        <button type="button" id="get-location" class="button secondary">Get My Location</button>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" name="latitude" step="any" placeholder="e.g., -37.8136">
                        </div>
                        
                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" name="longitude" step="any" placeholder="e.g., 144.9631">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Full address of the location">
                    </div>
                    
                    <hr class="form-divider">
                    
                    <div class="form-group">
                        <label for="facilities">Facilities (comma separated)</label>
                        <input type="text" id="facilities" name="facilities" placeholder="e.g., Baby change, Nursing room, Microwave">
                    </div>
                    
                    <div class="form-group">
                        <label for="images">Images</label>
                        <input type="file" id="images" name="images" multiple accept="image/*">
                        <div id="imagePreview" class="image-preview"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="cost">Cost (optional)</label>
                        <input type="number" id="cost" name="cost" step="0.01" placeholder="e.g., 5.00">
                    </div>
                    
                    <div class="form-group">
                        <label>Age Group</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="age-newborns" name="age_group" value="Newborns (0-3 months)">
                                <label for="age-newborns">Newborns (0-3 months)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="age-sitters" name="age_group" value="Sitters (4-7 months)">
                                <label for="age-sitters">Sitters (4-7 months)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="age-crawlers" name="age_group" value="Crawlers (7-12 months)">
                                <label for="age-crawlers">Crawlers (7-12 months)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="age-walkers" name="age_group" value="Walkers (12+ months)">
                                <label for="age-walkers">Walkers (12+ months)</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="contact_info">Email</label>
                        <input type="email" id="contact_info" name="contact_info" placeholder="Enter your email address">
                    </div>
                    
                    <div class="form-group">
                        <label for="website_url">Website URL</label>
                        <input type="url" id="website_url" name="website_url" placeholder="https://example.com">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="start_time">Start Time (for events)</label>
                            <input type="datetime-local" id="start_time" name="start_time">
                        </div>
                        
                        <div class="form-group">
                            <label for="end_time">End Time (for events)</label>
                            <input type="datetime-local" id="end_time" name="end_time">
                        </div>
                    </div>
                    
                    <div class="message-container">
                        <div id="loadingMessage" class="message loading" style="display: none;">
                            <div class="spinner"></div>
                            <span>Submitting...</span>
                        </div>
                        <div id="successMessage" class="message success" style="display: none;">
                            Point added successfully! It will be reviewed before appearing on the map.
                        </div>
                        <div id="errorMessage" class="message error" style="display: none;"></div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="button primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Baby Sleep App. All rights reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { addPoint, supabase } from './supabase-client.js';
        
        // Get form elements
        const form = document.getElementById('add-point-form');
        const getLocationButton = document.getElementById('get-location');
        const messageElement = document.getElementById('form-message');
        
        // File upload preview
        const imageInput = document.getElementById('images');
        const imagePreview = document.getElementById('imagePreview');

        imageInput.addEventListener('change', () => {
            imagePreview.innerHTML = '';
            const files = Array.from(imageInput.files);
            
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const preview = document.createElement('div');
                        preview.className = 'preview-item';
                        
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'remove-image';
                        removeBtn.innerHTML = '×';
                        removeBtn.onclick = () => {
                            preview.remove();
                            // Create a new FileList without the removed file
                            const dt = new DataTransfer();
                            const remainingFiles = Array.from(imageInput.files)
                                .filter(f => f !== file);
                            remainingFiles.forEach(f => dt.items.add(f));
                            imageInput.files = dt.files;
                        };
                        
                        preview.appendChild(img);
                        preview.appendChild(removeBtn);
                        imagePreview.appendChild(preview);
                    };
                    reader.readAsDataURL(file);
                }
            });
        });
        
        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitButton = form.querySelector('button[type="submit"]');
            const loadingMessage = document.getElementById('loadingMessage');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                // Show loading state
                submitButton.disabled = true;
                loadingMessage.style.display = 'block';
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
                
                // Get form data
                const formData = new FormData(form);
                const pointData = {
                    type: formData.get('type'),
                    title: formData.get('title'),
                    description: formData.get('description'),
                    latitude: parseFloat(formData.get('latitude')),
                    longitude: parseFloat(formData.get('longitude')),
                    address: formData.get('address'),
                    facilities: formData.getAll('facilities'),
                    cost: formData.get('cost'),
                    age_group: formData.get('age_group'),
                    contact_info: formData.get('contact_info'),
                    website_url: formData.get('website_url'),
                    start_time: formData.get('start_time') || null,
                    end_time: formData.get('end_time') || null,
                    submission_status: 'pending'
                };
                
                // Handle image uploads
                const imageFiles = form.querySelector('input[type="file"]').files;
                if (imageFiles.length > 0) {
                    pointData.images = await uploadImages(Array.from(imageFiles));
                }
                
                // Add point to database
                const { data, error } = await addPoint(pointData);
                
                if (error) {
                    console.error('Error submitting point:', error);
                    
                    // Provide more specific error messages based on the error code
                    let errorText = 'An error occurred while submitting the point.';
                    
                    if (error.code === '42501') {
                        errorText = 'Permission denied. Please try again later or contact support.';
                    } else if (error.code === '23505') {
                        errorText = 'A point with this information already exists.';
                    } else if (error.message) {
                        errorText = error.message;
                    }
                    
                    errorMessage.textContent = errorText;
                    errorMessage.style.display = 'block';
                    throw new Error(errorText);
                }
                
                // Show success message
                successMessage.style.display = 'block';
                form.reset();
                document.getElementById('imagePreview').innerHTML = '';
                
            } catch (error) {
                console.error('Error submitting point:', error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
            } finally {
                // Reset loading state
                submitButton.disabled = false;
                loadingMessage.style.display = 'none';
            }
        });
        
        // Handle get location button click
        getLocationButton.addEventListener('click', () => {
            if (navigator.geolocation) {
                // Show loading state
                const loadingMessage = document.getElementById('loadingMessage');
                const errorMessage = document.getElementById('errorMessage');
                
                loadingMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                
                navigator.geolocation.getCurrentPosition(
                    position => {
                        // Set latitude and longitude fields
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        
                        // Try to get address using reverse geocoding
                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}`)
                            .then(response => response.json())
                            .then(data => {
                                if (data && data.display_name) {
                                    document.getElementById('address').value = data.display_name;
                                }
                                loadingMessage.style.display = 'none';
                            })
                            .catch(error => {
                                console.error('Error getting address:', error);
                                loadingMessage.style.display = 'none';
                                errorMessage.textContent = 'Error getting address. Please enter it manually.';
                                errorMessage.style.display = 'block';
                            });
                    },
                    error => {
                        console.error('Error getting location:', error);
                        loadingMessage.style.display = 'none';
                        errorMessage.textContent = `Error getting location: ${error.message}. Please enter coordinates manually.`;
                        errorMessage.style.display = 'block';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = 'Geolocation is not supported by your browser.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
