<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Me Make My Baby Sleep</title>
    <meta name="description" content="A soothing app for baby sleep sounds">
    <meta name="theme-color" content="#FBF0ED">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon-192x192.png">
    <link rel="icon" type="image/png" href="assets/images/icon-192x192.png">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Baby Sleep Sounds</h1>
            <p class="subtitle">Soothing sounds for peaceful sleep</p>
        </header>

        <main>
            <div class="carousel-container">
                <div class="carousel-wrapper" id="carouselWrapper">
                    <!-- Sound cards will be dynamically inserted here -->
                </div>
                <div class="carousel-indicators" id="carouselIndicators">
                    <!-- Indicators will be dynamically inserted here -->
                </div>
            </div>
        </main>

        <div class="fixed-player">
            <div class="mini-player">
                <img id="currentCover" src="assets/images/default-cover.png" alt="Current sound cover">
                <div class="mini-track-info">
                    <h3 id="miniCurrentTrack">Select a sound</h3>
                    <p id="miniCurrentCategory">Category</p>
                </div>
            </div>
            
            <div class="player-controls">
                <button id="prevTrackBtn" class="control-btn" aria-label="Previous">
                    <span class="control-icon">⏮</span>
                </button>
                <button id="playPauseBtn" class="control-btn play-btn" aria-label="Play/Pause">
                    <span class="play-icon">▶</span>
                </button>
                <button id="nextTrackBtn" class="control-btn" aria-label="Next">
                    <span class="control-icon">⏭</span>
                </button>
            </div>

            <div class="volume-control">
                <button id="volumeBtn" class="control-btn volume-btn" aria-label="Volume">
                    <span class="volume-icon">🔊</span>
                </button>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
