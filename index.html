<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Baby Sleep & Rhyme Time - Help your baby sleep better with soothing sounds and nursery rhymes">
    <meta name="theme-color" content="#FFF1E6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Baby Sleep">
    <meta name="apple-itunes-app" content="app-clip-bundle-id=com.babysleep.app">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baby Sleep & Rhyme Time</title>
    <link rel="stylesheet" href="styles.css?v=1.0.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon.svg">
    <link rel="icon" href="assets/images/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        
        <header>
            <h1>Baby Sleep & Rhyme Time</h1>
            <p class="subtitle">Soothing sounds and nursery rhymes for your little one</p>
            <img src="assets/images/baby-meditate.png" alt="Peaceful baby meditating" class="hero-image">
            <img src="assets/images/chevron-down.svg" alt="" class="chevron-down" aria-hidden="true">
        </header>
        
        <main>
            <div class="tile-grid">
                <a href="sleep-sounds.html" class="tile">
                    <div class="tile-icon">
                        <img src="assets/images/baby-sleep.png" alt="Sleep Sounds">
                    </div>
                    <div class="tile-content">
                        <h2>Sleep Sounds</h2>
                        <p>Soothing sounds to help your baby sleep</p>
                    </div>
                </a>
                
                <a href="baby-time.html" class="tile">
                    <div class="tile-icon">
                        <img src="assets/images/baby-excited.png" alt="Baby Time">
                    </div>
                    <div class="tile-content">
                        <h2>Baby Time</h2>
                        <p>Fun videos to watch with your baby</p>
                    </div>
                </a>
                
                <a href="baby-days-out.html" class="tile">
                    <div class="tile-icon">
                        <img src="assets/images/baby-map.png" alt="Baby Days Out">
                    </div>
                    <div class="tile-content">
                        <h2>Baby Days Out</h2>
                        <p>Find parent facilities and baby events near you</p>
                    </div>
                </a>
            </div>
        </main>
        
        <footer>
            <p>Made with ❤️ for parents and babies</p>
        </footer>
    </div>
    
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
