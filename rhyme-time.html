<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fun videos to watch with your baby">
    <meta name="theme-color" content="#FFF1E6">
    <title>Baby Rhyme Time - Baby Sleep & Rhyme Time</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon.svg">
    <link rel="icon" href="assets/images/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="index.html" class="back-button">
                <img src="assets/images/chevron-left.svg" alt="Back" class="back-icon">
            </a>
            <h1>Baby time</h1>
            <p class="subtitle">Select your fun videos below to watch with your baby</p>
        </header>
        
        <main>
            <div class="video-container">
                <div id="player"></div>
            </div>
            
            <div class="video-grid" id="videoGrid">
                <!-- Video cards will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <script src="rhyme-time.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
